<div class="sidebar h-screen w-60 pl-4 pt-2 bg-secondary">
  <div class="logo flex h-12 items-center justify-between px-3 mb-4">
    <span class="text-2xl font-bold">ZeroVault</span>
    <button
      type="button"
      class="inline-flex size-9 items-center justify-center rounded-control"
    ></button>
  </div>

  <div class="links flex flex-col gap-y-2 px-3">
    <div
      class="relative mb-3 bg-background/60 py-2 rounded-panel cursor-pointer grid grid-cols-[24px_1fr] items-center gap-2"
      (click)="toggleNewMenu()"
    >
      <app-icon [name]="'plus'" />
      <span>New</span>

      @if (isMenuOpen()) {
        <div
          class="absolute left-0 top-full right-0 z-10 mt-2 bg-background p-2 rounded-panel flex flex-col items-center"
        >
          <button
            type="button"
            (click)="createFolder()"
            class="cursor-pointer grid grid-cols-[24px_1fr] items-center gap-2"
          >
            <app-icon [name]="'create-folder'" />
            <span>Create folder</span>
          </button>

          <button
            type="button"
            (click)="fileInput.click()"
            class="cursor-pointer grid grid-cols-[24px_1fr] items-center gap-2"
          >
            <app-icon [name]="'file-upload'" />
            <span>Upload file</span>
          </button>

          <button
            type="button"
            (click)="uploadFolder()"
            class="cursor-pointer grid grid-cols-[24px_1fr] items-center gap-2"
          >
            <app-icon [name]="'folder-upload'" />
            <span>Upload folder</span>
          </button>
        </div>
      }

      <input #fileInput type="file" class="hidden" multiple (change)="onFileSelected($event)"/>
    </div>

    <a routerLink="/files" class="grid grid-cols-[24px_1fr] items-center gap-2">
      <app-icon [name]="'files'" />
      <span>My Files</span>
    </a>

    <a routerLink="/shared" class="grid grid-cols-[24px_1fr] items-center gap-2">
      <app-icon [name]="'shared'" />
      <span>Shared with me</span>
    </a>

    <a routerLink="/account" class="grid grid-cols-[24px_1fr] items-center gap-2">
      <app-icon [name]="'account'" />
      <span>Account</span>
    </a>
  </div>
</div>
