<div class="flex h-svh overflow-hidden">
  <app-sidebar
    (transfersRequested)="toggleTransfers()"
    [failedTransferCount]="transferStore.failedCount()"
    (logoutRequested)="logout()"
  />

  <div class="flex min-w-0 flex-1 flex-col">
    <header class="shrink-0" [class.hidden]="!isDriveRoute()">
      <app-topbar
        (createFolderRequested)="openCreateFolderDialog()"
        (uploadFileRequested)="fileInput.click()"
        (searchChanged)="onSearchChanged($event)"
        (kindChanged)="onKindChanged($event)"
      />

      <input type="file" #fileInput hidden (change)="onFileChanged($event)" multiple />
    </header>

    <main class="min-h-0 flex-1 overflow-hidden" [class.mt-3]="!isDriveRoute()">
      <router-outlet />
    </main>

    <div
      class="fixed inset-0 z-20 bg-black/50 transition-opacity duration-200 ease-out"
      [class.opacity-100]="transfersOpen()"
      [class.opacity-0]="!transfersOpen()"
      [class.pointer-events-auto]="transfersOpen()"
      [class.pointer-events-none]="!transfersOpen()"
      (click)="closeTransfers()"
    ></div>

    <app-transfer-panel
      [open]="transfersOpen()"
      (dismissed)="closeTransfers()"
      [transfers]="transferStore.transfers()"
    ></app-transfer-panel>
  </div>
</div>
