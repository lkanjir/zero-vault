<aside class="flex h-full w-full flex-col">
  <div class="grid h-16 shrink-0 grid-cols-[minmax(0,1fr)_4rem] items-center">
    <div
      class="grid min-w-0 grid-cols-[4rem_minmax(0,1fr)] items-center overflow-hidden transition-opacity duration-150"
      [class.opacity-0]="!open()"
      [class.opacity-100]="open()"
    >
      <span class="flex items-center justify-center">
        <app-icon [name]="'user'" />
      </span>

      @if (userProfile(); as profile) {
        <span class="truncate text-lg font-semibold"
          >{{ profile.firstName }} {{ profile.lastName }}</span
        >
      }
    </div>

    <button
      type="button"
      class="flex size-10 items-center justify-center justify-self-center rounded-md hover:bg-surface-hover"
      (click)="toggleOpen()"
    >
      <app-icon [name]="open() ? 'panel-left-close' : 'panel-left'" [size]="24" />
    </button>
  </div>

  <app-sidebar-item
    [sidebarOpen]="open()"
    [iconName]="'cloud'"
    [text]="'Moj disk'"
    [link]="'/drive'"
  >
  </app-sidebar-item>

  <app-sidebar-item
    [sidebarOpen]="open()"
    [iconName]="'share-2'"
    [text]="'Dijeljene datoteke'"
    [link]="'/share'"
  >
  </app-sidebar-item>

  <app-sidebar-item
    (click)="transfersRequested.emit()"
    [sidebarOpen]="open()"
    [iconName]="'arrow-up-down'"
    [badgeCount]="failedTransferCount()"
    [text]="'Aktivni prijenosi'"
  >
  </app-sidebar-item>

  <app-sidebar-item
    [sidebarOpen]="open()"
    [iconName]="'gallery-vertical-end'"
    [text]="'Aktivnosti'"
    [link]="'/audit'"
  >
  </app-sidebar-item>

  <button
    type="button"
    (click)="logoutRequested.emit()"
    class="mt-auto grid h-12 shrink-0 cursor-pointer grid-cols-[4rem_minmax(0,1fr)] items-center rounded-md hover:bg-surface-hover"
  >
    <span class="flex items-center justify-center">
      <app-icon [name]="'log-out'" />
    </span>

    <span class="truncate text-left text-lg font-semibold">Odjava</span>
  </button>
</aside>
