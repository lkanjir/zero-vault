<a
  [routerLink]="link()"
  class="grid h-12 shrink-0 grid-cols-[4rem_minmax(0,1fr)] items-center rounded-md hover:bg-surface-hover"
>
  <div class="flex items-center justify-center">
    <div class="relative flex">
      <app-icon [name]="iconName()" />
      @if (badgeCount() > 0) {
        <span
          class="absolute -top-1 -right-1 size-2.5 rounded-full bg-danger ring-2 ring-surface"
        ></span>
      }
    </div>
  </div>
  <span class="truncate text-lg font-semibold">{{ text() }}</span>
</a>
