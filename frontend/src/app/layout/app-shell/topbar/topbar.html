<div id="topbar" class="flex h-16 items-center justify-center gap-3">
  <div class="flex w-[70%] justify-center gap-3">
    <div class="relative shrink-0">
      <select
        #kindFilter
        (change)="onKindChanged(kindFilter.value)"
        class="h-10 shrink-0 cursor-pointer appearance-none rounded-md bg-surface py-0 pr-9 pl-3 text-sm font-semibold text-foreground"
      >
        <option value="">Sve</option>
        <option value="file">Datoteke</option>
        <option value="folder">Direktoriji</option>
      </select>

      <app-icon
        [name]="'chevron-down'"
        [size]="16"
        class="pointer-events-none absolute top-1/2 right-3 -translate-y-1/2 text-foreground"
      />
    </div>

    <div
      id="search-bar"
      class="flex h-10 min-w-0 flex-1 cursor-pointer gap-2 rounded-md bg-surface px-2"
    >
      <app-icon [name]="'search'" [size]="16" [stroke]="3" class="gap-2 text-foreground-muted" />
      <input
        #search
        id="search"
        type="text"
        placeholder="Pretraži po nazivu"
        (input)="onSearchInput(search.value)"
        class="w-full text-sm font-semibold text-foreground-muted placeholder-foreground-muted"
      />
    </div>
    <button
      [cdkMenuTriggerFor]="upload"
      type="button"
      class="flex h-10 cursor-pointer items-center justify-center gap-1 rounded-md bg-surface px-2 text-sm font-semibold"
    >
      <app-icon [name]="'plus'" [size]="16" [stroke]="3" />
      Novo
    </button>

    <ng-template #upload>
      <div
        cdkMenu
        class="mt-2 min-w-40 overflow-hidden rounded-md border-border bg-surface shadow-xl"
      >
        <button
          cdkMenuItem
          type="button"
          class="flex h-10 w-full items-center gap-2 border-b border-border px-3 text-sm hover:bg-surface-hover"
          (cdkMenuItemTriggered)="createFolderRequested.emit()"
        >
          <app-icon [size]="16" [name]="'folder-open'" />
          <span>Dodaj direktorij</span>
        </button>

        <button
          cdkMenuItem
          type="button"
          class="flex h-10 w-full items-center gap-2 px-3 text-sm hover:bg-surface-hover"
          (cdkMenuItemTriggered)="uploadFileRequested.emit()"
        >
          <app-icon [size]="16" [name]="'file-text'" />
          <span>Prenesi datoteku</span>
        </button>

        <button
          cdkMenuItem
          type="button"
          class="flex h-10 w-full items-center gap-2 px-3 text-sm hover:bg-surface-hover"
          (cdkMenuItemTriggered)="uploadFolderRequested.emit()"
        >
          <app-icon [size]="16" [name]="'folder-up'" />
          <span>Prenesi mapu</span>
        </button>
      </div>
    </ng-template>
  </div>
</div>
