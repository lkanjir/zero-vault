<div id="topbar" class="flex min-h-16 items-center justify-center">
  <div
    class="flex w-full min-w-0 flex-wrap justify-center gap-2 px-4 py-2 sm:gap-3 md:w-4/5 lg:w-[70%]"
  >
    <div class="relative min-w-0 flex-1 sm:flex-none">
      <select
        #kindFilter
        [value]="kind() ?? ''"
        (change)="onKindChanged(kindFilter.value)"
        class="h-10 w-full cursor-pointer appearance-none rounded-md bg-surface py-0 pr-9 pl-3 text-sm font-semibold text-foreground sm:w-auto"
      >
        <option value="">Sve</option>
        <option value="file">Datoteke</option>
        <option value="folder">Direktoriji</option>
      </select>

      <app-icon
        [name]="'chevron-down'"
        [size]="16"
        class="pointer-events-none absolute top-1/2 right-3 -translate-y-1/2 text-foreground"
      />
    </div>

    <div
      id="search-bar"
      class="order-last flex h-10 w-full flex-none cursor-pointer gap-2 rounded-md bg-surface px-2 sm:order-none sm:w-auto sm:min-w-0 sm:flex-1"
    >
      <span class="hidden items-center text-foreground-muted sm:inline-flex">
        <app-icon [name]="'search'" [size]="16" [stroke]="3" />
      </span>
      <input
        #searchInputEl
        id="search"
        type="text"
        placeholder="Pretraži po nazivu"
        [value]="search()"
        (input)="onSearchInput(searchInputEl.value)"
        class="min-w-0 flex-1 text-sm font-semibold text-foreground-muted placeholder-foreground-muted"
      />
    </div>
    <button
      [cdkMenuTriggerFor]="upload"
      type="button"
      class="flex h-10 shrink-0 cursor-pointer items-center justify-center gap-1 rounded-md bg-surface px-2 text-sm font-semibold"
    >
      <app-icon [name]="'plus'" [size]="16" [stroke]="3" />
      Novo
    </button>

    <ng-template #upload>
      <div
        cdkMenu
        class="mt-2 min-w-40 overflow-hidden rounded-md border-border bg-surface shadow-xl"
      >
        <button
          cdkMenuItem
          type="button"
          class="flex h-10 w-full items-center gap-2 border-b border-border px-3 text-sm hover:bg-surface-hover"
          (cdkMenuItemTriggered)="createFolderRequested.emit()"
        >
          <app-icon [size]="16" [name]="'folder-open'" />
          <span>Dodaj direktorij</span>
        </button>

        <button
          cdkMenuItem
          type="button"
          class="flex h-10 w-full items-center gap-2 border-b border-border px-3 text-sm hover:bg-surface-hover"
          (cdkMenuItemTriggered)="uploadFileRequested.emit()"
        >
          <app-icon [size]="16" [name]="'file-text'" />
          <span>Prenesi datoteku</span>
        </button>

        <button
          cdkMenuItem
          type="button"
          class="flex h-10 w-full items-center gap-2 px-3 text-sm hover:bg-surface-hover"
          (cdkMenuItemTriggered)="uploadFolderRequested.emit()"
        >
          <app-icon [size]="16" [name]="'folder'" />
          <span>Prenesi mapu</span>
        </button>
      </div>
    </ng-template>
  </div>
</div>
