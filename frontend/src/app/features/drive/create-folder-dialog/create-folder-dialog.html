<div class="w-full rounded-lg bg-background p-6 shadow-xl">
  <form (submit)="onSubmit($event)">
    <label
      ><span class="mb-3 block text-lg font-bold">Kreiraj novi direktorij</span>
      <input
        type="text"
        [formField]="createFolderForm.name"
        class="mb-2 w-full rounded-md border border-border px-2 py-1 text-lg placeholder:text-sm"
        placeholder="Unesi naziv..."
      />
    </label>

    @if (createFolderForm.name().touched() && createFolderForm.name().invalid()) {
      <ul class="block pt-1 text-danger">
        @for (error of createFolderForm.name().errors(); track error) {
          <li>{{ error.message }}</li>
        }
      </ul>
    }

    @if (error()) {
      <span class="block pt-1 text-danger">{{ error() }}</span>
    }

    <div class="flex justify-end gap-3 py-1">
      <button
        type="button"
        class="h-10 cursor-pointer rounded-md border border-border bg-background px-2 font-semibold"
        (click)="closeDialog()"
      >
        Odustani
      </button>
      <button
        type="submit"
        class="h-10 cursor-pointer rounded-md bg-foreground px-2 text-sm font-semibold text-surface"
      >
        Kreiraj
      </button>
    </div>
  </form>
</div>
