<td class="px-4 py-2">
  <div class="flex min-w-0 items-center gap-3">
    <app-icon [name]="'file-text'" />
    <span class="truncate text-lg">{{ entry().name }}</span>
  </div>
</td>

@let item = entry();

@if (item.kind === 'file') {
  <td class="px-4 py-2 text-lg whitespace-nowrap">{{ item.sizeBytes | fileSize }}</td>
} @else {
  <td class="px-4 py-2 text-lg whitespace-nowrap">-</td>
}

<td class="px-4 py-2 text-lg whitespace-nowrap">{{ item.updatedAt }}</td>
