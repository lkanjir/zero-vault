@let item = entry();

<td class="px-4 py-2">
  @if (item.kind === 'folder') {
    <a [routerLink]="['/drive', item.id]" class="flex min-w-0 items-center gap-3">
      <app-icon [name]="'folder'" />
      <span class="truncate text-lg">{{ entry().name }}</span>
    </a>
  } @else {
    <div class="flex min-w-0 items-center gap-3">
      <app-icon [name]="'file-text'" />
      <span class="truncate text-lg">{{ entry().name }}</span>
    </div>
  }
</td>

@if (item.kind === 'file') {
  <td class="px-4 py-2 text-lg whitespace-nowrap">{{ item.sizeBytes | fileSize }}</td>
} @else {
  <td class="px-4 py-2 text-lg whitespace-nowrap">-</td>
}

<td class="px-4 py-2 text-right text-lg whitespace-nowrap">
  {{ item.updatedAt | date: 'dd.MM.yyyy HH:mm' }}
</td>
