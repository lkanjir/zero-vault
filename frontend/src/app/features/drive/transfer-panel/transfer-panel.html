<aside
  class="fixed inset-y-0 right-0 z-30 block w-96 max-w-full border-l border-border bg-surface shadow-xl transition-transform duration-200 ease-out"
  [class.translate-x-0]="open()"
  [class.translate-x-full]="!open()"
  [class.pointer-events-auto]="open()"
  [class.pointer-events-none]="!open()"
>
  <header class="flex h-16 items-center justify-between px-5">
    <h2 class="text-lg font-semibold">Aktivni prijenosi</h2>
    <button type="button" (click)="dismissed.emit()" class="rounded-sm hover:bg-surface-hover">
      <app-icon class="text-foreground" [name]="'x'" [size]="24" />
    </button>
  </header>

  @for (transfer of transfers(); track transfer.id) {
    <section class="px-5 pt-2">
      <div class="flex items-center gap-2">
        <div
          class="flex size-10 shrink-0 items-center justify-center rounded-md bg-surface-hover text-foreground"
        >
          <app-icon class="bg-surface-hover text-foreground" [name]="'file-text'" [size]="24" />
        </div>
        <div class="flex size-10 w-full min-w-0 flex-col">
          <span class="truncate font-medium">{{ transfer.fileName }}</span>
          <div class="flex w-full items-center justify-between">
            <span class="mt-0.5 text-xs text-foreground-muted">{{
              transfer.sizeBytes | fileSize
            }}</span>
            @if (transfer.bytesPerSecond !== null) {
              <span class="mt-0.5 text-xs text-foreground-muted">
                {{ transfer.bytesPerSecond | fileSize }}/s
              </span>
            } @else {
              <span class="mt-0.5 text-xs text-foreground-muted">—</span>
            }
          </div>
        </div>
      </div>

      <div class="mt-4 h-1 overflow-hidden rounded-full bg-border">
        <div
          class="h-full rounded-full bg-foreground transition-[width] duration-200 ease-out"
          [style.width.%]="transfer.progress"
        ></div>
      </div>
    </section>
  }
</aside>
