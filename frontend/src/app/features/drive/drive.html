<section class="mx-auto w-full md:w-4/5 lg:w-[70%]">
  <table class="w-full table-auto text-left">
    <thead class="border-b border-border text-sm text-foreground-muted">
      <tr>
        <th class="w-1/2 px-4 py-1 font-medium">Naziv</th>
        <th class="w-px px-4 py-1 font-medium whitespace-nowrap">Veličina</th>
        <th class="w-px px-4 py-1 font-medium whitespace-nowrap">Datum promjene</th>
      </tr>
    </thead>
    <tbody>
      @if (loading() && entries().length === 0) {
        <tr>
          <td colspan="3" class="px-4 py-10 text-center text-foreground-muted">Učitavanje</td>
        </tr>
      } @else if (error()) {
        <tr>
          <td colspan="3" class="px-4 py-10 text-center">
            <p class="text-danger">{{ error() }}</p>
            <button type="button" (click)="retry()" class="mt-3 text-primary">
              Pokušaj ponovno
            </button>
          </td>
        </tr>
      } @else if (entries().length === 0) {
        <tr>
          <td colspan="3" class="px-4 py-10 text-center text-foreground-muted">
            Ova mapa je prazna
          </td>
        </tr>
      } @else {
        @for (entry of entries(); track entry.id) {
          <tr app-entry-item [entry]="entry" [cdkContextMenuTriggerFor]="entryMenu"></tr>

          <ng-template #entryMenu>
            <div
              cdkMenu
              cdkTargetMenuAim
              class="min-w-40 rounded-md border-border bg-surface shadow-xl"
            >
              <button
                cdkMenuItem
                type="button"
                class="flex h-10 w-full items-center gap-2 px-3 text-sm hover:bg-surface-hover focus:bg-surface-hover"
                (cdkMenuItemTriggered)="download(entry)"
              >
                <app-icon [name]="'download'" [size]="16" />
                <span>Preuzmi</span>
              </button>

              <button
                cdkMenuItem
                type="button"
                class="flex h-10 w-full items-center gap-2 px-3 text-sm hover:bg-surface-hover focus:bg-surface-hover"
                (cdkMenuItemTriggered)="rename(entry)"
              >
                <app-icon [name]="'square-pen'" [size]="16" />
                <span>Preimenuj</span>
              </button>

              <button
                cdkMenuItem
                type="button"
                class="flex h-10 w-full items-center gap-2 px-3 text-sm hover:bg-surface-hover focus:bg-surface-hover"
                (cdkMenuItemTriggered)="move(entry)"
              >
                <app-icon [name]="'move'" [size]="16" />
                <span>Premjesti</span>
              </button>

              <button
                cdkMenuItem
                type="button"
                class="flex h-10 w-full items-center gap-2 px-3 text-sm hover:bg-surface-hover focus:bg-surface-hover"
                (cdkMenuItemTriggered)="delete(entry)"
              >
                <app-icon [name]="'trash'" [size]="16" />
                <span>Obriši</span>
              </button>
            </div>
          </ng-template>
        }
      }
    </tbody>
  </table>
</section>
