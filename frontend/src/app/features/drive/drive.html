<section class="mx-auto w-full md:w-4/5 lg:w-[70%]">
  <table class="w-full table-auto text-left">
    <thead class="border-b border-border text-sm text-foreground-muted">
      <tr>
        <th class="w-full px-4 py-1 font-medium">Naziv</th>
        <th class="w-1/4 px-4 py-1 font-medium">Veličina</th>
        <th class="px-4 py-1 font-medium whitespace-nowrap">Datum promjene</th>
      </tr>
    </thead>
    <tbody>
      <tr class="hover:bg-surface-hover">
        <td class="px-4 py-2">
          <div class="flex min-w-0 items-center gap-3">
            <app-icon [name]="'file-text'" />
            <span class="truncate text-lg">File name</span>
          </div>
        </td>

        <td class="px-4 py-2 text-lg">40MB</td>
        <td class="px-4 py-2 text-lg whitespace-nowrap">26.05.2026. 19:45</td>
      </tr>
    </tbody>
  </table>
</section>
