name: zero-vault-keycloak-dev

services:
  keycloak-db:
    image: postgres:18
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

    volumes:
      - "keycloak_db_data:/var/lib/postgresql"

    ports:
      - "127.0.0.1:5433:5432"

    networks:
      - keycloak-network

    healthcheck:
      test: 
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  keycloak:
    build:
      context: .
      dockerfile: Containerfile
      args:
        KEYCLOAK_VERSION: ${KEYCLOAK_VERSION:-26.7.0}
    
    restart: unless-stopped

    command:
      - start-dev
      - --import-realm
      - --spi-theme--static-max-age=-1
      - --spi-theme--cache-themes=false
      - --spi-theme--cache-templates=false

    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: "true"

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}

      ZERO_VAULT_SSL_REQUIRED: ${ZERO_VAULT_SSL_REQUIRED:-external}
      ZERO_VAULT_WEB_ORIGIN: ${ZERO_VAULT_WEB_ORIGIN:-http://localhost:4200}
      ZERO_VAULT_WEB_REDIRECT_URI: ${ZERO_VAULT_WEB_REDIRECT_URI:-http://localhost:4200/*}
      ZERO_VAULT_WEB_POST_LOGOUT_REDIRECT_URI: ${ZERO_VAULT_WEB_POST_LOGOUT_REDIRECT_URI:-http://localhost:4200/*}
            
    ports:
      - "127.0.0.1:8080:8080"

    networks:
      - keycloak-network

    volumes:
      - ./realm:/opt/keycloak/data/import:ro
      - ./themes:/opt/keycloak/themes:ro
    
    depends_on:
      keycloak-db:
        condition: service_healthy

volumes:
  keycloak_db_data:

networks:
  keycloak-network:
    driver: bridge