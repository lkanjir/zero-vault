services:

  app-db:
    image: postgres:18
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${METADATA_DB_NAME:-zerovault}
      POSTGRES_USER: ${METADATA_DB_USER:-api}
      POSTGRES_PASSWORD: ${METADATA_DB_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - app_db_data:/var/lib/postgresql

  keycloak-db:
    image: postgres:18
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_SCHEMA_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

    volumes:
      - "keycloak_db_data:/var/lib/postgresql"

    ports:
      - "127.0.0.1:5433:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3 
    restart: unless-stopped

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_SCHEMA_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true

    command: ["start-dev"]

    ports:
      - "127.0.0.1:8080:8080"
    
    depends_on:
      - keycloak-db

  localstack:
    image: localstack/localstack-pro
    restart: unless-stopped

    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN} # required for Pro
      - SERVICES=s3
      - DEBUG=${LOCALSTACK_DEBUG:-0}
      - PERSISTENCE=${LOCALSTACK_PERSISTENCE:-1}
      - AWS_DEFAULT_REGION=eu-central-1

    ports:
      - '127.0.0.1:4566:4566' # LocalStack Gateway
      - '127.0.0.1:4510-4559:4510-4559' # external services port range
      #- '127.0.0.1:443:443' # LocalStack HTTPS Gateway (Pro)

    volumes:
      - 'localstack-data:/var/lib/localstack'
      - '/var/run/docker.sock:/var/run/docker.sock'
      - './localstack-init:/etc/localstack/init/ready.d:ro'

volumes:
  app_db_data:
  keycloak_db_data:
  localstack-data:
